name: preflight

# فحص ما قبل النشر: يتحقق بالأسماء والصيغ فقط (لا تُطبع أي قيمة سرّية) من أسرار
# ومتغيرات المستودع ومن Environment المدرسة. يعمل عند تغيير ملفّيه أو يدوياً بمدخل
# `school` (اسم الـEnvironment، والافتراضي demo). النتيجة في ملخص التشغيل وفي
# تعليقات `preflight-*` العامة.
#
# كل اسم يُمرَّر صراحةً (secrets.N في N، وvars.N في VAR_N). لا يُستعمل
# toJSON(secrets) لأن GitHub يعدّه نمطاً مشبوهاً ويوقف التشغيل لموافقة يدوية.
# اختبار tool/preflight_test.py يتحقق أن القوائم هنا تطابق tool/preflight.py.
on:
  push:
    paths:
      - .github/workflows/preflight.yml
      - tool/preflight.py
      - tool/signing/VERIFY
  workflow_dispatch:
    inputs:
      school:
        description: اسم المدرسة (اسم الـEnvironment)
        required: true
        default: demo

permissions:
  contents: read

jobs:
  # دون Environment لا يرى المسار إلا قيم المستودع: فما خاص بمدرسة وُجد هنا فهو في
  # مكان خاطئ، وإلا سقط مسار مدرسة على قيمة مدرسة أخرى.
  repo-level:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check repository-level names
        env:
          SCHOOL_KEYSTORE_BASE64: ${{ secrets.SCHOOL_KEYSTORE_BASE64 }}
          VAR_SCHOOL_KEYSTORE_BASE64: ${{ vars.SCHOOL_KEYSTORE_BASE64 }}
          SCHOOL_KEYSTORE_PASSWORD: ${{ secrets.SCHOOL_KEYSTORE_PASSWORD }}
          VAR_SCHOOL_KEYSTORE_PASSWORD: ${{ vars.SCHOOL_KEYSTORE_PASSWORD }}
          SCHOOL_KEY_ALIAS: ${{ secrets.SCHOOL_KEY_ALIAS }}
          VAR_SCHOOL_KEY_ALIAS: ${{ vars.SCHOOL_KEY_ALIAS }}
          SCHOOL_KEY_PASSWORD: ${{ secrets.SCHOOL_KEY_PASSWORD }}
          VAR_SCHOOL_KEY_PASSWORD: ${{ vars.SCHOOL_KEY_PASSWORD }}
          GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
          VAR_GOOGLE_DESKTOP_CLIENT_SECRET: ${{ vars.GOOGLE_DESKTOP_CLIENT_SECRET }}
          GOOGLE_DRIVE_WINDOWS_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_WINDOWS_CLIENT_ID }}
          VAR_GOOGLE_DRIVE_WINDOWS_CLIENT_ID: ${{ vars.GOOGLE_DRIVE_WINDOWS_CLIENT_ID }}
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
          VAR_GOOGLE_SERVER_CLIENT_ID: ${{ vars.GOOGLE_SERVER_CLIENT_ID }}
          GOOGLE_SERVICES_ADMIN: ${{ secrets.GOOGLE_SERVICES_ADMIN }}
          VAR_GOOGLE_SERVICES_ADMIN: ${{ vars.GOOGLE_SERVICES_ADMIN }}
          GOOGLE_SERVICES_TEACHER: ${{ secrets.GOOGLE_SERVICES_TEACHER }}
          VAR_GOOGLE_SERVICES_TEACHER: ${{ vars.GOOGLE_SERVICES_TEACHER }}
          GOOGLE_SERVICES_STUDENT: ${{ secrets.GOOGLE_SERVICES_STUDENT }}
          VAR_GOOGLE_SERVICES_STUDENT: ${{ vars.GOOGLE_SERVICES_STUDENT }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VAR_FIREBASE_SERVICE_ACCOUNT: ${{ vars.FIREBASE_SERVICE_ACCOUNT }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VAR_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          VAR_SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VAR_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VAR_SUPABASE_ACCESS_TOKEN: ${{ vars.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          VAR_SUPABASE_DB_PASSWORD: ${{ vars.SUPABASE_DB_PASSWORD }}
          OWNER_PHONE: ${{ secrets.OWNER_PHONE }}
          VAR_OWNER_PHONE: ${{ vars.OWNER_PHONE }}
          OWNER_INITIAL_PASSWORD: ${{ secrets.OWNER_INITIAL_PASSWORD }}
          VAR_OWNER_INITIAL_PASSWORD: ${{ vars.OWNER_INITIAL_PASSWORD }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          VAR_LLM_API_KEY: ${{ vars.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          VAR_LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          VAR_LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          GOOGLE_DRIVE_OWNER_EMAIL: ${{ secrets.GOOGLE_DRIVE_OWNER_EMAIL }}
          VAR_GOOGLE_DRIVE_OWNER_EMAIL: ${{ vars.GOOGLE_DRIVE_OWNER_EMAIL }}
        run: python3 tool/preflight.py repo

  school:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ${{ inputs.school || 'demo' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the school environment
        env:
          SCHOOL: ${{ inputs.school || 'demo' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VAR_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          VAR_SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VAR_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VAR_SUPABASE_ACCESS_TOKEN: ${{ vars.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          VAR_SUPABASE_DB_PASSWORD: ${{ vars.SUPABASE_DB_PASSWORD }}
          OWNER_PHONE: ${{ secrets.OWNER_PHONE }}
          VAR_OWNER_PHONE: ${{ vars.OWNER_PHONE }}
          OWNER_INITIAL_PASSWORD: ${{ secrets.OWNER_INITIAL_PASSWORD }}
          VAR_OWNER_INITIAL_PASSWORD: ${{ vars.OWNER_INITIAL_PASSWORD }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          VAR_LLM_API_KEY: ${{ vars.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          VAR_LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          VAR_LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          GOOGLE_DRIVE_OWNER_EMAIL: ${{ secrets.GOOGLE_DRIVE_OWNER_EMAIL }}
          VAR_GOOGLE_DRIVE_OWNER_EMAIL: ${{ vars.GOOGLE_DRIVE_OWNER_EMAIL }}
        run: python3 tool/preflight.py school

  # يفتح مفتاح التوقيع النهائي بكلمتيه واسمه المستعار ويقرأ بصمته (غير سرّية) لتسجيلها في
  # Google وFirebase. لا يُطبع إلا النجاح أو سبب الفشل والبصمة. لإعادة الفحص بعد تعديل
  # الأسرار غيّر محتوى tool/signing/VERIFY.
  signing-key:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Open the signing key with its alias and passwords
        shell: bash
        env:
          SCHOOL_KEYSTORE_BASE64: ${{ secrets.SCHOOL_KEYSTORE_BASE64 }}
          SCHOOL_KEYSTORE_PASSWORD: ${{ secrets.SCHOOL_KEYSTORE_PASSWORD }}
          SCHOOL_KEY_ALIAS: ${{ secrets.SCHOOL_KEY_ALIAS }}
          SCHOOL_KEY_PASSWORD: ${{ secrets.SCHOOL_KEY_PASSWORD }}
        run: |
          set +e
          if [ -z "$SCHOOL_KEYSTORE_BASE64" ]; then
            echo "::notice title=preflight-signing::لا مفتاح توقيع نهائي بعد في أسرار المستودع (يُستعمل مفتاح التجربة)"
            exit 0
          fi
          missing=""
          for n in SCHOOL_KEYSTORE_PASSWORD SCHOOL_KEY_ALIAS SCHOOL_KEY_PASSWORD; do
            if [ -z "${!n}" ]; then missing="$missing $n"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error title=preflight-signing::أسرار ناقصة:$missing"
            exit 1
          fi
          printf '%s' "$SCHOOL_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/release.jks" 2>/dev/null
          if [ ! -s "$RUNNER_TEMP/release.jks" ]; then
            echo "::error title=preflight-signing::SCHOOL_KEYSTORE_BASE64 ليست base64 صالحة"
            exit 1
          fi
          out=$(keytool -list -v -keystore "$RUNNER_TEMP/release.jks" -alias "$SCHOOL_KEY_ALIAS" -storepass:env SCHOOL_KEYSTORE_PASSWORD 2>&1)
          status=$?
          if [ "$status" != "0" ]; then
            if echo "$out" | grep -qi "password was incorrect"; then reason="كلمة مرور الملف خاطئة"
            elif echo "$out" | grep -qi "does not exist"; then reason="الاسم المستعار غير موجود في الملف"
            else reason="تعذّر فتح الملف (ليس ملف مفاتيح صالحاً)"; fi
            echo "::error title=preflight-signing::$reason"
            exit 1
          fi
          sha1=$(echo "$out" | grep -m1 -E "SHA1:" | sed 's/^[[:space:]]*//')
          keytool -certreq -alias "$SCHOOL_KEY_ALIAS" -keystore "$RUNNER_TEMP/release.jks" -storepass:env SCHOOL_KEYSTORE_PASSWORD -keypass:env SCHOOL_KEY_PASSWORD > /dev/null 2>&1
          if [ "$?" != "0" ]; then
            echo "::error title=preflight-signing::كلمة المرور SCHOOL_KEY_PASSWORD لا تفتح المفتاح الخاص"
            exit 1
          fi
          echo "::notice title=preflight-signing::signing-key=ok alias=$SCHOOL_KEY_ALIAS $sha1"
