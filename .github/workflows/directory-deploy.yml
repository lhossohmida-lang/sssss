name: directory-deploy

# ينشئ دليل المدارس (مشروع Supabase باسم `directory`) إن لم يوجد، ويطبّق ترحيلاته، ويفحصه بمفتاحه العام: القراءة
# تعمل والتسجيل والجداول مغلقة. يعمل داخل Environment مدرسة (الافتراضي demo) فيه SUPABASE_ACCESS_TOKEN (رمز المطوّر
# الشخصي) وSUPABASE_PROJECT_REF، ومنهما تُؤخذ المنظمة والمنطقة ليكون الدليل بجوار تلك المدرسة. لا يلزم Environment جديد ولا
# أي سرّ جديد: كلمة سر قاعدة الدليل تُولَّد عشوائياً ولا تُخزَّن (الترحيلات تمرّ بـManagement API)، ومفتاحاه يُجلبان بالرمز.
#
# يُشغَّل يدوياً (workflow_dispatch) مرة، ثم كلما تغيّرت ترحيلات الدليل. نتيجته تعليق `directory-public` فيه عنوان الدليل
# ومفتاحه العام (عامّان): يُحفظان في `directory/public.json` فتضمّنهما التطبيقات العامة وقت البناء (بلا رمز ربط)، وتسجّل
# مسارات supabase-deploy كل مدرسة فيه. لا تُطبع أي قيمة سرّية؛ النتائج والأخطاء في تعليقات `directory-*` العامة.
on:
  workflow_dispatch:
    inputs:
      school:
        description: اسم Environment مدرسة فيه رمز Supabase الشخصي (الافتراضي demo)
        required: true
        default: demo
      register:
        description: سجّل مدرسة هذا الـEnvironment في الدليل بعد تهيئته (يكفيه رمز يصل إلى مشروع الدليل)
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: directory-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.school || 'demo' }}
    steps:
      - uses: actions/checkout@v4

      - name: Create the directory if needed, prepare it and check it
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || secrets.SUPABASE_PROJECT_REF }}
        run: python3 tool/directory_setup.py setup

      # تسجيل المدرسة في الدليل (اختياري، مدخل register): يكفيه رمز يصل إلى مشروع الدليل وحده (يُجلب به مفتاحه السرّي)،
      # فيدخل صاحب المدرسة برقم هاتفه وتظهر مدرسته في القائمة دون انتظار supabase-deploy. لا يضبط أسرار دوال المدرسة
      # (يُهمَل مفتاح التسجيل الجديد)، فيبقى تسجيل أرقام العمال الجدد في الدليل لـsupabase-deploy الذي يُعيد التسجيل
      # ويضع المفتاح بعد أن يصل رمزه إلى مشروع المدرسة أيضاً. القيم نفسها التي يمرّرها supabase-deploy.
      - name: Register the school in the directory (optional)
        if: ${{ inputs.register }}
        env:
          DIRECTORY_URL: ${{ vars.DIRECTORY_URL }}
          DIRECTORY_ANON_KEY: ${{ vars.DIRECTORY_ANON_KEY }}
          DIRECTORY_SERVICE_KEY: ${{ secrets.DIRECTORY_SERVICE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SCHOOL_SLUG: ${{ inputs.school || 'demo' }}
          SCHOOL_NAME: ${{ vars.SCHOOL_NAME }}
          SCHOOL_LISTED: ${{ vars.SCHOOL_LISTED }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY }}
          OWNER_PHONE: ${{ vars.OWNER_PHONE || secrets.OWNER_PHONE }}
        run: python3 tool/directory_register.py register
