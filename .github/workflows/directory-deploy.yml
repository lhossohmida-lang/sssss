name: directory-deploy

# ينشئ دليل المدارس (مشروع Supabase باسم `directory`) إن لم يوجد، ويطبّق ترحيلاته، ويفحصه بمفتاحه العام: القراءة
# تعمل والتسجيل والجداول مغلقة. يعمل داخل Environment مدرسة (الافتراضي demo) فيه SUPABASE_ACCESS_TOKEN (رمز المطوّر
# الشخصي) وSUPABASE_PROJECT_REF، ومنهما تُؤخذ المنظمة والمنطقة ليكون الدليل بجوار تلك المدرسة. لا يلزم Environment جديد ولا
# أي سرّ جديد: كلمة سر قاعدة الدليل تُولَّد عشوائياً ولا تُخزَّن (الترحيلات تمرّ بـManagement API)، ومفتاحاه يُجلبان بالرمز.
#
# يُشغَّل يدوياً (workflow_dispatch) مرة، ثم كلما تغيّرت ترحيلات الدليل. نتيجته تعليق `directory-public` فيه عنوان الدليل
# ومفتاحه العام (عامّان): يُحفظان في `directory/public.json` فتضمّنهما التطبيقات العامة وقت البناء (بلا رمز ربط)، وتسجّل
# مسارات supabase-deploy كل مدرسة فيه. لا تُطبع أي قيمة سرّية؛ النتائج والأخطاء في تعليقات `directory-*` العامة.
on:
  workflow_dispatch:
    inputs:
      school:
        description: اسم Environment مدرسة فيه رمز Supabase الشخصي (الافتراضي demo)
        required: true
        default: demo

permissions:
  contents: read

concurrency:
  group: directory-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.school || 'demo' }}
    steps:
      - uses: actions/checkout@v4

      - name: Create the directory if needed, prepare it and check it
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || secrets.SUPABASE_PROJECT_REF }}
        run: python3 tool/directory_setup.py setup
