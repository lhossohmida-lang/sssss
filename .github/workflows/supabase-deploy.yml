name: supabase-deploy

# ينشر خادم مدرسة على مشروع Supabase الخاص بها: الترحيلات ثم الدوال ثم التهيئة (تعطيل
# التسجيل العام، وإنشاء حساب المالك، ودخول تجريبي). لكل مدرسة Environment باسمها (مدخل
# `school`، والافتراضي demo). يعمل تلقائياً لمدرسة demo حين تتغير ملفات الخادم، ويدوياً
# (workflow_dispatch) لأي مدرسة. لا تُطبع أي قيمة سرّية؛ النتائج والأخطاء في تعليقات
# `supabase-*` العامة (دون أسرار).
on:
  push:
    paths:
      - .github/workflows/supabase-deploy.yml
      - tool/supabase_bootstrap.py
      - tool/ci_error.py
      - tool/server_check.py
      - supabase/DEPLOY
      - supabase/config.toml
      - supabase/migrations/**
      - supabase/functions/**
  workflow_dispatch:
    inputs:
      school:
        description: اسم المدرسة (اسم الـEnvironment)
        required: true
        default: demo
      reseed:
        description: أعد كتابة بيانات العرض الوهمية (مدرسة demo فقط)
        type: boolean
        default: false
      reset_owner_password:
        description: أعد كلمة سر المالك إلى قيمة السرّ OWNER_INITIAL_PASSWORD (لمالك نسيها أو لم تعد تطابق السرّ)، ويُلزَم بتغييرها عند الدخول
        type: boolean
        default: false

permissions:
  contents: read

# نشران على المشروع نفسه معاً قد يتعارضان: يُنتظر الأول ولا يُلغى.
concurrency:
  group: supabase-deploy-${{ inputs.school || 'demo' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: ${{ inputs.school || 'demo' }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify access to the project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || secrets.SUPABASE_PROJECT_REF }}
        run: python3 tool/supabase_bootstrap.py verify

      # تنزيل مباشر من إصدارات المستودع الرسمي: محوّل `latest` في إجراء setup-cli يستعلم
      # واجهة GitHub دون رمز فيتجاوز حدّ الطلبات على عناوين المشغّلات المشتركة.
      - name: Install the Supabase CLI
        shell: bash
        run: |
          set -e
          mkdir -p "$HOME/.local/bin"
          curl -fsSL --retry 3 "https://github.com/supabase/cli/releases/latest/download/supabase_linux_amd64.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" supabase
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "::notice title=supabase-cli::$("$HOME/.local/bin/supabase" --version)"

      - name: Link the project and apply the migrations
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || secrets.SUPABASE_PROJECT_REF }}
          MASK_ENV: SUPABASE_DB_PASSWORD,SUPABASE_ACCESS_TOKEN
        run: |
          set +e
          supabase link --project-ref "$SUPABASE_PROJECT_REF" > supabase-db.log 2>&1
          status=$?
          if [ "$status" = "0" ]; then
            # دون --remote يستهدف الأمر قاعدة محلية (Docker) لا المشروع المربوط.
            supabase db push --yes --remote >> supabase-db.log 2>&1
            status=$?
          fi
          cat supabase-db.log
          if [ "$status" != "0" ]; then
            python3 tool/ci_error.py supabase-db-push supabase-db.log 40
          fi
          exit "$status"

      - name: Deploy the Edge Functions
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || secrets.SUPABASE_PROJECT_REF }}
          MASK_ENV: SUPABASE_ACCESS_TOKEN
        run: |
          set +e
          # الإصدار 3 من CLI يطلب تأكيداً (--yes) ولا يطلبه في بيئة بلا طرفية، ويفضّل --remote على --project-ref.
          supabase functions deploy --remote="$SUPABASE_PROJECT_REF" --yes > supabase-functions.log 2>&1
          status=$?
          cat supabase-functions.log
          if [ "$status" != "0" ]; then
            python3 tool/ci_error.py supabase-functions supabase-functions.log 40
          fi
          exit "$status"

      # دليل المدارس: يسجّل المدرسة (اسمها وخادمها ومفتاحها العام ورقم مالكها) ويصدّر مفتاح تسجيل جديداً لها
      # تضعه الخطوة التالية في أسرار دوال المدرسة فتسجّل دالة إنشاء الحسابات أرقام العمال الجدد في الدليل.
      # عنوان الدليل ومفتاحه العام من متغيرات المستودع إن وُجدت وإلا من الملف directory/public.json (ويُصدَّران للخطوة
      # التالية)، ومفتاحه السرّي من DIRECTORY_SERVICE_KEY إن وُجد وإلا يُجلب برمز Supabase الشخصي في أثناء التشغيل.
      # دون دليل لا تفعل شيئاً (مدرسة بلا دليل). وبلا SCHOOL_NAME تأخذ مدرسة demo اسم بياناتها الوهمية.
      - name: Register the school in the directory
        env:
          DIRECTORY_URL: ${{ vars.DIRECTORY_URL }}
          DIRECTORY_ANON_KEY: ${{ vars.DIRECTORY_ANON_KEY }}
          DIRECTORY_SERVICE_KEY: ${{ secrets.DIRECTORY_SERVICE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SCHOOL_SLUG: ${{ inputs.school || 'demo' }}
          SCHOOL_NAME: ${{ vars.SCHOOL_NAME }}
          SCHOOL_LISTED: ${{ vars.SCHOOL_LISTED }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY }}
          OWNER_PHONE: ${{ vars.OWNER_PHONE || secrets.OWNER_PHONE }}
        run: python3 tool/directory_register.py register

      - name: Set the function secrets (assistant, push and directory, when the school has them)
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL || secrets.LLM_MODEL }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL || secrets.LLM_BASE_URL }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          DIRECTORY_SLUG: ${{ inputs.school || 'demo' }}
          MASK_ENV: SUPABASE_ACCESS_TOKEN,LLM_API_KEY,FIREBASE_SERVICE_ACCOUNT,PUSH_SECRET,DIRECTORY_REGISTER_KEY
        run: |
          set +e
          args=()
          if [ -n "$LLM_API_KEY" ]; then args+=("LLM_API_KEY=$LLM_API_KEY"); fi
          if [ -n "$LLM_MODEL" ]; then args+=("LLM_MODEL=$LLM_MODEL"); fi
          if [ -n "$LLM_BASE_URL" ]; then args+=("LLM_BASE_URL=$LLM_BASE_URL"); fi
          # الدليل: عنوانه ومفتاحه العام واسم المدرسة ومفتاح تسجيلها (من الخطوة السابقة عبر GITHUB_ENV).
          if [ -n "$DIRECTORY_URL" ] && [ -n "$DIRECTORY_ANON_KEY" ] && [ -n "$DIRECTORY_REGISTER_KEY" ]; then
            args+=("DIRECTORY_URL=$DIRECTORY_URL" "DIRECTORY_ANON_KEY=$DIRECTORY_ANON_KEY" "DIRECTORY_SLUG=$DIRECTORY_SLUG" "DIRECTORY_REGISTER_KEY=$DIRECTORY_REGISTER_KEY")
          fi
          # الدفع: حساب خدمة Firebase (سرّ المطوّر) + سرّ مشترك جديد في كل نشر بين قاعدة المدرسة
          # ودالة send-push، لا يُحفظ في أي مكان آخر ولا يُطبع.
          push=false
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            compact="$(printf '%s' "$FIREBASE_SERVICE_ACCOUNT" | python3 -c 'import json,sys; print(json.dumps(json.load(sys.stdin), separators=(",", ":")))' 2>/dev/null)"
            if [ -n "$compact" ]; then
              PUSH_SECRET="$(python3 -c 'import secrets; print(secrets.token_hex(32))')"
              echo "::add-mask::$PUSH_SECRET"
              export PUSH_SECRET
              args+=("FIREBASE_SERVICE_ACCOUNT=$compact" "PUSH_SECRET=$PUSH_SECRET")
              push=true
            else
              echo "::warning title=supabase-secrets::FIREBASE_SERVICE_ACCOUNT ليس JSON صالحاً فلا دفع في هذه المدرسة"
            fi
          fi
          if [ "${#args[@]}" = "0" ]; then
            echo "::notice title=supabase-secrets::لا أسرار مساعد ولا دفع ولا دليل في هذه المدرسة بعد"
            exit 0
          fi
          supabase secrets set "${args[@]}" --remote="$SUPABASE_PROJECT_REF" --yes > supabase-secrets.log 2>&1
          status=$?
          cat supabase-secrets.log
          if [ "$status" != "0" ]; then
            python3 tool/ci_error.py supabase-secrets supabase-secrets.log 30
            exit "$status"
          fi
          echo "::notice title=supabase-secrets::ضُبطت أسرار الدوال (${#args[@]})"
          if [ "$push" = "true" ]; then
            python3 tool/supabase_bootstrap.py push-config
            exit $?
          fi
          exit 0

      - name: Configure sign-in, create the owner, smoke test
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY }}
          OWNER_PHONE: ${{ vars.OWNER_PHONE || secrets.OWNER_PHONE }}
          OWNER_INITIAL_PASSWORD: ${{ secrets.OWNER_INITIAL_PASSWORD }}
        run: python3 tool/supabase_bootstrap.py bootstrap

      # عند الطلب فقط (مدخل reset_owner_password): يعيد كلمة سر المالك الموجود إلى OWNER_INITIAL_PASSWORD
      # ويُلزمه بتغييرها عند أول دخول، ثم يجرّب الدخول بها. لا تُطبع كلمة السر؛ النتيجة في تعليق
      # `supabase-reset-owner-password`. للمالك الذي نسي كلمة سره أو لُصق السرّ بسطر زائد فلم تطابق ما يكتبه.
      - name: Reset the owner password (on request)
        if: ${{ inputs.reset_owner_password }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY }}
          OWNER_PHONE: ${{ vars.OWNER_PHONE || secrets.OWNER_PHONE }}
          OWNER_INITIAL_PASSWORD: ${{ secrets.OWNER_INITIAL_PASSWORD }}
        run: python3 tool/supabase_bootstrap.py reset-owner-password

      # مدرسة العرض فقط: رمز ربط الأجهزة بها (عنوان الخادم والمفتاح العام والاسم، ولا سرّ فيه) ليُلصق في
      # التطبيق العام عند أول تشغيل. بياناتها وهمية فلا ضرر من ظهوره في التعليقات العلنية؛ ولا يُطبع
      # لمدرسة عميل حقيقية (يبقى عنوان خادمها لها): انظر tool/pairing_code.py.
      # تنبيه: GitHub يخفي ما يطابق قيمة سرّ، حتى بترميز base64، فإن كان المفتاح العام محفوظاً في Secrets
      # خرج الرمز مشوّهاً (***). لذلك لا يُطبع إلا حين يكون في Variables (وهو عام بطبيعته).
      - name: Print the demo pairing code
        if: ${{ (inputs.school || 'demo') == 'demo' }}
        shell: bash
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY }}
          KEY_IS_SECRET: ${{ secrets.SUPABASE_ANON_KEY != '' }}
        run: |
          set -e
          if [ "$KEY_IS_SECRET" = "true" ]; then
            echo "::notice title=supabase-pairing::المفتاح العام محفوظ في Secrets فيخفي GitHub جزءاً من الرمز. انقله إلى Variables في Environment demo (هو عام بطبيعته) ثم أعد النشر، أو ولّد الرمز على حاسوبك بـ tool/pairing_code.py"
            exit 0
          fi
          code="$(python3 tool/pairing_code.py --url "$SUPABASE_URL" --key "$SUPABASE_ANON_KEY" --name "مدرسة العرض")"
          echo "::notice title=supabase-pairing::$code"
          {
            echo "### رمز ربط مدرسة العرض"
            echo
            echo "الصقه في التطبيق عند أول تشغيل (أو امسحه): لا سرّ فيه."
            echo
            echo '```'
            echo "$code"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # مدرسة العرض فقط: فحوص تنشئ حساب أستاذ وصفوفاً مؤقتة وتحذفها، فلا تُشغَّل على مدرسة
      # عميل حقيقية. تعمل بمالك مؤقت لا بمالك المدرسة الحقيقي (كلمة سره تتغير بعد أول دخول).
      - name: Create a temporary owner for the checks
        if: ${{ (inputs.school || 'demo') == 'demo' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
        run: python3 tool/supabase_bootstrap.py temp-owner-create

      - name: Check the server contract (RLS, sync, functions, storage)
        if: ${{ (inputs.school || 'demo') == 'demo' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY }}
        run: python3 tool/server_check.py

      - name: Remove the temporary owners
        if: ${{ always() && (inputs.school || 'demo') == 'demo' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
        run: python3 tool/supabase_bootstrap.py temp-owner-delete

      # مدرسة العرض فقط، وآخر خطوة (بعد الفحوص): بيانات وهمية واقعية (تلاميذ وأساتذة ومجموعات وحصص وحضور
      # ودفعات) تُزرع مرة واحدة بالمفتاح السرّي، ويرفض الزرع إن وُجد تلاميذ حقيقيون. حسابات دخول أساتذة العرض
      # وأوليائه لا تُنشأ إلا إن وُضع سرّ DEMO_ACCOUNTS_PASSWORD في Environment (وإلا تُنشأ من تطبيق الإدارة).
      - name: Seed the demo data (once)
        if: ${{ (inputs.school || 'demo') == 'demo' }}
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          DEMO_ACCOUNTS_PASSWORD: ${{ secrets.DEMO_ACCOUNTS_PASSWORD }}
          RESEED: ${{ inputs.reseed }}
        run: |
          flag=""
          if [ "$RESEED" = "true" ]; then flag="--force"; fi
          python3 tool/demo_seed.py seed $flag
