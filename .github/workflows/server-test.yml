name: server-test

# اختبارات Dart على خادم المدرسة الحقيقي (مزامنة REST و«آخر تعديل يفوز» والبث اللحظي
# والملفات) بمكوّنات التطبيق نفسها. لكل مدرسة Environment باسمها (مدخل `school`،
# والافتراضي demo). تنشئ صفوفاً وملفات اختبار صغيرة على مدرسة العرض فقط. لا تُطبع أي
# قيمة سرّية؛ الفشل يظهر في تعليق `server-test` العام بعد إخفاء الأسرار.
on:
  push:
    paths:
      - .github/workflows/server-test.yml
      - packages/core/test/server/**
      - packages/core/lib/src/data/remote/**
  workflow_dispatch:
    inputs:
      school:
        description: اسم المدرسة (اسم الـEnvironment)
        required: true
        default: demo

permissions:
  contents: read

# لا يتداخل مع نشر الخادم نفسه (قد يعدّل المخطط أو الدوال).
concurrency:
  group: supabase-deploy-${{ inputs.school || 'demo' }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.47.9"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: ${{ inputs.school || 'demo' }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Run the real-server tests
        working-directory: packages/core
        shell: bash
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY }}
          OWNER_PHONE: ${{ vars.OWNER_PHONE || secrets.OWNER_PHONE }}
          OWNER_INITIAL_PASSWORD: ${{ secrets.OWNER_INITIAL_PASSWORD }}
          MASK_ENV: SUPABASE_ANON_KEY,OWNER_INITIAL_PASSWORD
        run: |
          set +e
          flutter test test/server/real_server_test.dart \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=OWNER_PHONE="$OWNER_PHONE" \
            --dart-define=OWNER_INITIAL_PASSWORD="$OWNER_INITIAL_PASSWORD" \
            > server-test.log 2>&1
          status=$?
          tail -n 60 server-test.log
          if [ "$status" != "0" ]; then
            python3 ../../tool/ci_error.py server-test server-test.log 40
          else
            echo "::notice title=server-test::$(grep -E 'All tests passed|\+[0-9]+' server-test.log | tail -n 1)"
          fi
          exit "$status"
