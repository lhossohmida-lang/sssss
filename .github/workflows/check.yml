name: check

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.9"

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings
      - name: Test
        shell: bash
        run: |
          set +e
          dart run melos run test --no-select 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          # تظهر أسماء الاختبارات الفاشلة في ملخص التشغيل دون فتح السجل.
          grep -E "\[E\]$|Some tests failed" test.log | sort -u | head -30             | while IFS= read -r line; do echo "::error title=test::${line:0:400}"; done
          exit $status
      - name: Upload golden images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-images
          path: |
            packages/**/test/**/goldens/**
            apps/**/test/**/goldens/**
            **/test/**/failures/**
          if-no-files-found: ignore

  server-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations and run SQL tests
        run: ./tool/pg_test.sh
