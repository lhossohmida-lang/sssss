name: check

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.9"

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true
      - name: Check and test the assistant function
        shell: bash
        run: |
          set +e
          deno check supabase/functions/assistant/index.ts supabase/functions/assistant/index_test.ts > assistant-deno-check.log 2>&1
          status=$?
          if [ "$status" != "0" ]; then
            msg=$(tail -n 35 assistant-deno-check.log | sed 's/%/%25/g; s/\r/%0D/g' | awk '{printf "%s%%0A", substr($0,1,400)}')
            echo "::error title=assistant-deno-check::${msg}"
            exit "$status"
          fi
          cat assistant-deno-check.log

          deno test --allow-env supabase/functions/assistant/index_test.ts > assistant-deno-test.log 2>&1
          status=$?
          if [ "$status" != "0" ]; then
            msg=$(tail -n 35 assistant-deno-test.log | sed 's/%/%25/g; s/\r/%0D/g' | awk '{printf "%s%%0A", substr($0,1,400)}')
            echo "::error title=assistant-deno-test::${msg}"
            exit "$status"
          fi
          cat assistant-deno-test.log
      - name: Check and test the account functions
        shell: bash
        run: |
          set +e
          deno check supabase/functions/_shared/accounts.ts supabase/functions/_shared/accounts_test.ts supabase/functions/_shared/directory.ts supabase/functions/_shared/directory_test.ts supabase/functions/provision-account/index.ts supabase/functions/provision-account/index_test.ts supabase/functions/reset-account-password/index.ts supabase/functions/reset-account-password/index_test.ts supabase/functions/change-login/index.ts supabase/functions/change-login/index_test.ts supabase/functions/reset-school/index.ts supabase/functions/reset-school/index_test.ts > accounts-deno-check.log 2>&1
          status=$?
          if [ "$status" != "0" ]; then
            msg=$(tail -n 35 accounts-deno-check.log | sed 's/%/%25/g; s/\r/%0D/g' | awk '{printf "%s%%0A", substr($0,1,400)}')
            echo "::error title=accounts-deno-check::${msg}"
            exit "$status"
          fi
          cat accounts-deno-check.log

          deno test --allow-env supabase/functions/_shared/accounts_test.ts supabase/functions/_shared/directory_test.ts supabase/functions/provision-account/index_test.ts supabase/functions/reset-account-password/index_test.ts supabase/functions/change-login/index_test.ts supabase/functions/reset-school/index_test.ts > accounts-deno-test.log 2>&1
          status=$?
          if [ "$status" != "0" ]; then
            msg=$(tail -n 40 accounts-deno-test.log | sed 's/%/%25/g; s/\r/%0D/g' | awk '{printf "%s%%0A", substr($0,1,400)}')
            echo "::error title=accounts-deno-test::${msg}"
            exit "$status"
          fi
          cat accounts-deno-test.log
      - name: Check and test the push function
        shell: bash
        run: |
          set +e
          deno check supabase/functions/_shared/fcm.ts supabase/functions/send-push/index.ts supabase/functions/send-push/index_test.ts > push-deno-check.log 2>&1
          status=$?
          if [ "$status" != "0" ]; then
            msg=$(tail -n 35 push-deno-check.log | sed 's/%/%25/g; s/\r/%0D/g' | awk '{printf "%s%%0A", substr($0,1,400)}')
            echo "::error title=push-deno-check::${msg}"
            exit "$status"
          fi
          cat push-deno-check.log

          deno test --allow-env supabase/functions/send-push/index_test.ts > push-deno-test.log 2>&1
          status=$?
          if [ "$status" != "0" ]; then
            msg=$(tail -n 40 push-deno-test.log | sed 's/%/%25/g; s/\r/%0D/g' | awk '{printf "%s%%0A", substr($0,1,400)}')
            echo "::error title=push-deno-test::${msg}"
            exit "$status"
          fi
          cat push-deno-test.log
      - name: Test the CI tools
        run: python3 -m unittest discover -s tool -p "*_test.py" -v
      - name: Test
        shell: bash
        run: |
          set +e
          dart run melos run test --no-select 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          # أسماء الاختبارات الفاشلة (وإلا آخر السجل) تظهر في ملخص التشغيل.
          if [ "$status" != "0" ]; then
            grep -E "❌|\[E\]|Some tests failed|failed" test.log | sort -u | head -n 40 > fail.log
            [ -s fail.log ] || tail -n 40 test.log > fail.log
            msg=$(sed 's/%/%25/g' fail.log | awk '{printf "%s%%0A", substr($0,1,300)}')
            echo "::error title=test-failures::${msg}"
          fi
          exit $status
      - name: Upload golden images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-images
          path: |
            packages/**/test/**/goldens/**
            apps/**/test/**/goldens/**
            **/test/**/failures/**
          if-no-files-found: ignore

  server-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations and run SQL tests
        shell: bash
        run: |
          set +e
          ./tool/pg_test.sh 2>&1 | tee pg-test.log
          status=${PIPESTATUS[0]}
          if [ "$status" != "0" ]; then
            grep -E "ERROR:|FATAL:|failed|FAIL|العملية|رأى .* والمتوقع|عملية ممنوعة" pg-test.log \
              | tail -n 30 > pg-failure.log
            [ -s pg-failure.log ] || tail -n 30 pg-test.log > pg-failure.log
            msg=$(sed 's/%/%25/g' pg-failure.log | awk '{printf "%s%%0A", substr($0,1,300)}')
            echo "::error title=server-sql-failure::${msg}"
          fi
          exit "$status"

  # يتحقق أن إضافة google-services تتوافق مع Android Gradle Plugin وFlutter: يبني APK تجريبياً لكل تطبيق
  # بملف إعداد اصطناعي (قيم وهمية لا سرّية) بدل اكتشاف الخلل في أول بناء إصدار حقيقي.
  android-firebase:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        app: [admin, teacher, student]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Write a synthetic Firebase config
        run: python3 tool/fake_google_services.py apps/${{ matrix.app }}/android/app/google-services.json dz.school.admin dz.school.teacher dz.school.student
      - name: Build a debug APK with the Google services plugin
        working-directory: apps/${{ matrix.app }}
        shell: bash
        run: |
          set +e
          flutter build apk --debug --dart-define=FIREBASE_PUSH_ENABLED=true > android-firebase.log 2>&1
          status=$?
          if [ "$status" != "0" ]; then
            python3 ../../tool/ci_error.py android-firebase-${{ matrix.app }} android-firebase.log 40
            exit "$status"
          fi
          tail -n 5 android-firebase.log
