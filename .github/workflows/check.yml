name: check

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.9"

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings
      - name: Test
        shell: bash
        run: |
          set +e
          dart run melos run test --no-select 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          # أسماء الاختبارات الفاشلة (وإلا آخر السجل) تظهر في ملخص التشغيل.
          if [ "$status" != "0" ]; then
            grep -E "❌|\[E\]|Some tests failed|failed" test.log | sort -u | head -n 40 > fail.log
            [ -s fail.log ] || tail -n 40 test.log > fail.log
            msg=$(sed 's/%/%25/g' fail.log | awk '{printf "%s%%0A", substr($0,1,300)}')
            echo "::error title=test-failures::${msg}"
          fi
          exit $status
      - name: Upload golden images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-images
          path: |
            packages/**/test/**/goldens/**
            apps/**/test/**/goldens/**
            **/test/**/failures/**
          if-no-files-found: ignore

  server-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations and run SQL tests
        run: ./tool/pg_test.sh
