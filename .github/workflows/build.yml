name: build

# يُشغَّل عند تغيير ملف RELEASE_VERSION (محتواه هو وسم النسخة)، أو يدوياً.
on:
  push:
    paths:
      - RELEASE_VERSION
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.47.9"

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        app: [admin, teacher, student]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SCHOOL_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SCHOOL_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi
      - name: Build APK
        working-directory: apps/${{ matrix.app }}
        env:
          SCHOOL_KEYSTORE_PASSWORD: ${{ secrets.SCHOOL_KEYSTORE_PASSWORD }}
          SCHOOL_KEY_ALIAS: ${{ secrets.SCHOOL_KEY_ALIAS }}
          SCHOOL_KEY_PASSWORD: ${{ secrets.SCHOOL_KEY_PASSWORD }}
        run: flutter build apk --release
      - name: Rename APK
        run: |
          mkdir -p dist
          cp apps/${{ matrix.app }}/build/app/outputs/flutter-apk/app-release.apk "dist/school-${{ matrix.app }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.app }}
          path: dist/*.apk
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Build Windows
        working-directory: apps/admin
        run: flutter build windows --release
      - name: Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path apps/admin/build/windows/x64/runner/Release/* -DestinationPath dist/school-admin-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-admin
          path: dist/*.zip
          if-no-files-found: error

  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: version
        run: echo "tag=$(head -n 1 RELEASE_VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ startsWith(steps.version.outputs.tag, 'preview') }}
          files: dist/*
          body: |
            ملفات التثبيت:
            - `school-admin.apk` تطبيق الإدارة (Android)
            - `school-teacher.apk` تطبيق الأستاذ (Android)
            - `school-student.apk` تطبيق التلميذ والولي (Android)
            - `school-admin-windows.zip` تطبيق الإدارة (Windows): فك الضغط ثم شغّل `admin.exe`
