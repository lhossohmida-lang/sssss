name: build

# يُشغَّل عند تغيير ملف RELEASE_VERSION (محتواه هو وسم النسخة)، أو يدوياً.
#
# النسخة العامة (الافتراضية) لا تضمّن إعداد أي مدرسة: يفتح كل تطبيق على شاشة «ربط المدرسة» ويُربط برمزها
# وقت التشغيل، فملف واحد يخدم كل المدارس. وهي وحدها التي تُنشر في Releases. وأسرار المطوّر المشتركة
# (مفتاح التوقيع وإعدادات Firebase وGoogle) تُضمَّن فيها من مستوى المستودع. يعمل البناء العام داخل
# Environment اسمه `public` دون أي قيم، فلا تتسرّب إليه قيمة مدرسة.
#
# أما بناء خاص بمدرسة (يدوياً مع مدخل `school`) فيضمّن رابط خادمها ومفتاحها العام من Environment باسمها،
# ويبقى أرتيفاكتاً في التشغيل ولا يُنشر علناً.
on:
  push:
    paths:
      - RELEASE_VERSION
  workflow_dispatch:
    inputs:
      school:
        description: اسم المدرسة لبناء خاص بإعدادها (اسم الـEnvironment)؛ اتركه فارغاً للبناء العام
        required: false
        default: ""

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.47.9"

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ inputs.school || 'public' }}
    strategy:
      fail-fast: false
      matrix:
        app: [admin, teacher, student]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SCHOOL_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SCHOOL_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi
      # ملف Firebase لهذا التطبيق: سرّه الخاص، أو GOOGLE_SERVICES_JSON المشترك (ملف واحد يحوي التطبيقات
      # الثلاثة). بوجوده تُطبَّق إضافة google-services ويُفعَّل الدفع.
      - name: Prepare Firebase config
        shell: bash
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICES_ADMIN: ${{ secrets.GOOGLE_SERVICES_ADMIN }}
          GOOGLE_SERVICES_TEACHER: ${{ secrets.GOOGLE_SERVICES_TEACHER }}
          GOOGLE_SERVICES_STUDENT: ${{ secrets.GOOGLE_SERVICES_STUDENT }}
        run: |
          case "${{ matrix.app }}" in
            admin) json="${GOOGLE_SERVICES_ADMIN:-$GOOGLE_SERVICES_JSON}" ;;
            teacher) json="${GOOGLE_SERVICES_TEACHER:-$GOOGLE_SERVICES_JSON}" ;;
            student) json="${GOOGLE_SERVICES_STUDENT:-$GOOGLE_SERVICES_JSON}" ;;
          esac
          if [ -n "$json" ]; then
            printf '%s' "$json" > "apps/${{ matrix.app }}/android/app/google-services.json"
            echo "FIREBASE_PUSH_ENABLED=true" >> "$GITHUB_ENV"
          fi
      - name: Build APK
        working-directory: apps/${{ matrix.app }}
        shell: bash
        env:
          SCHOOL_KEYSTORE_PASSWORD: ${{ secrets.SCHOOL_KEYSTORE_PASSWORD }}
          SCHOOL_KEY_ALIAS: ${{ secrets.SCHOOL_KEY_ALIAS }}
          SCHOOL_KEY_PASSWORD: ${{ secrets.SCHOOL_KEY_PASSWORD }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY }}
          GOOGLE_DRIVE_OWNER_EMAIL: ${{ vars.GOOGLE_DRIVE_OWNER_EMAIL || secrets.GOOGLE_DRIVE_OWNER_EMAIL }}
          GOOGLE_SERVER_CLIENT_ID: ${{ vars.GOOGLE_SERVER_CLIENT_ID }}
          SCHOOL: ${{ inputs.school }}
        run: |
          defines=()
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            defines+=("--dart-define=SUPABASE_URL=$SUPABASE_URL" "--dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY")
          fi
          if [ "${FIREBASE_PUSH_ENABLED:-}" = "true" ]; then
            defines+=("--dart-define=FIREBASE_PUSH_ENABLED=true")
          fi
          if [ "${{ matrix.app }}" = "admin" ]; then
            defines+=("--dart-define=GOOGLE_DRIVE_OWNER_EMAIL=$GOOGLE_DRIVE_OWNER_EMAIL" "--dart-define=GOOGLE_SERVER_CLIENT_ID=$GOOGLE_SERVER_CLIENT_ID")
          fi
          # التحديث التلقائي للبناء العام وحده: بناء مدرسة خاص (مدخل school) لا يستبدل نفسه بنسخة عامة فيفقد إعداده.
          if [ -z "$SCHOOL" ]; then
            tag="$(head -n 1 "$GITHUB_WORKSPACE/RELEASE_VERSION" | tr -d '[:space:]')"
            defines+=("--dart-define=APP_RELEASE=$tag" "--dart-define=UPDATE_REPO=$GITHUB_REPOSITORY")
          fi
          flutter build apk --release "${defines[@]}"
      - name: Rename APK
        run: |
          mkdir -p dist
          cp apps/${{ matrix.app }}/build/app/outputs/flutter-apk/app-release.apk "dist/school-${{ matrix.app }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.app }}
          path: dist/*.apk
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    environment: ${{ inputs.school || 'public' }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Build Windows
        working-directory: apps/admin
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY }}
          GOOGLE_DRIVE_OWNER_EMAIL: ${{ vars.GOOGLE_DRIVE_OWNER_EMAIL || secrets.GOOGLE_DRIVE_OWNER_EMAIL }}
          GOOGLE_DRIVE_WINDOWS_CLIENT_ID: ${{ vars.GOOGLE_DRIVE_WINDOWS_CLIENT_ID }}
          GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
          SCHOOL: ${{ inputs.school }}
        run: |
          $defines = @(
            "--dart-define=SUPABASE_URL=$env:SUPABASE_URL",
            "--dart-define=SUPABASE_ANON_KEY=$env:SUPABASE_ANON_KEY",
            "--dart-define=GOOGLE_DRIVE_OWNER_EMAIL=$env:GOOGLE_DRIVE_OWNER_EMAIL",
            "--dart-define=GOOGLE_DRIVE_WINDOWS_CLIENT_ID=$env:GOOGLE_DRIVE_WINDOWS_CLIENT_ID",
            "--dart-define=GOOGLE_DRIVE_WINDOWS_CLIENT_SECRET=$env:GOOGLE_DESKTOP_CLIENT_SECRET"
          )
          # التحديث التلقائي للبناء العام وحده (انظر خطوة Android).
          if (-not $env:SCHOOL) {
            $tag = (Get-Content "$env:GITHUB_WORKSPACE/RELEASE_VERSION" -TotalCount 1).Trim()
            $defines += "--dart-define=APP_RELEASE=$tag"
            $defines += "--dart-define=UPDATE_REPO=$env:GITHUB_REPOSITORY"
          }
          flutter build windows --release @defines
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Read version
        id: version
        shell: bash
        run: echo "tag=$(head -n 1 RELEASE_VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"
      # مكتبات Visual C++ بجانب admin.exe + فحص اكتمال المكتبات + المثبّت واختباره (انظر الإجراء). تُنسخ المكتبات إلى
      # مجلد Release نفسه فتحويها النسخة المضغوطة أيضاً، فلا تظهر رسائل DLL على جهاز نظيف بأي من الطريقتين.
      - uses: ./.github/actions/windows-package
        with:
          app-dir: apps/admin/build/windows/x64/runner/Release
          version: ${{ steps.version.outputs.tag }}
      - name: Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path apps/admin/build/windows/x64/runner/Release/* -DestinationPath dist/school-admin-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-admin
          path: |
            dist/school-admin-windows.zip
            dist/school-admin-setup.exe
          if-no-files-found: error

  # لا يُنشر علناً إلا البناء العام؛ بناء مدرسة خاص يبقى أرتيفاكتاً.
  release:
    needs: [android, windows]
    if: ${{ !inputs.school }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: version
        run: echo "tag=$(head -n 1 RELEASE_VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ startsWith(steps.version.outputs.tag, 'preview') }}
          files: dist/*
          body: |
            ملفات التثبيت:
            - `school-admin.apk` تطبيق الإدارة (Android)
            - `school-teacher.apk` تطبيق الأستاذ (Android)
            - `school-student.apk` تطبيق التلميذ والولي (Android)
            - `school-admin-setup.exe` مثبّت تطبيق الإدارة لـ Windows 10 وما بعده (الأسهل): يضمّ كل المكتبات اللازمة فلا تظهر
              رسائل DLL على أي جهاز، ويُثبَّت لمستخدم واحد دون صلاحيات مدير. قد تعرض Windows تحذير SmartScreen لأن الملف
              غير موقَّع: اختر «More info» ثم «Run anyway».
            - `school-admin-windows.zip` النسخة المحمولة (تضمّ المكتبات نفسها): فك الضغط ثم شغّل `admin.exe`

            عند أول تشغيل يطلب كل تطبيق رمز مدرستك (`SCH1.…`) لصقاً أو مسحاً بالكاميرا. يعطيك إياه صاحب
            المدرسة من تطبيق الإدارة ← الحساب ← رمز ربط الأجهزة الأخرى. ويمكن لتطبيق الإدارة أن يعمل
            «معاينة محلية» بلا خادم.
      # عقد التحديث التلقائي: التطبيقات تقرأ هذه الأصول من واجهة GitHub وتتحقق من بصمة SHA-256 المعلنة لكل ملف.
      # يفشل المسار إن نقص ملف أو بصمته أو كان رابطه خارج مستودعنا، فلا يصل جهازاً إصدار لا يستطيع تحديث نفسه.
      - name: Check the release assets the in-app updater reads
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: python3 tool/release_check.py "$TAG"
