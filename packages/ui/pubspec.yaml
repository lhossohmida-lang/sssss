name: school_ui
description: نظام التصميم claymorphism والمكونات المشتركة.
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.13.7
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  excel_plus: ^2.29.3
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  camera: ^0.11.0
  connectivity_plus: ^7.3.1
  file_picker: ^12.0.0
  flutter_riverpod: ^3.4.2
  flutter_test:
    sdk: flutter
  go_router: ^17.5.0
  mobile_scanner: ^7.5.0
  open_filex: ^4.7.0
  printing: ^5.14.0
  qr_flutter: ^4.1.0
  school_core:
    path: ../core
  school_chat:
    path: ../chat
  school_assistant:
    path: ../assistant
  speech_to_text: ^7.5.0
  url_launcher: ^6.3.3

dev_dependencies:
  drift: ^2.35.4
  flutter_lints: ^6.0.0

flutter:
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo.ttf
