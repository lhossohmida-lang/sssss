name: school_ui
description: نظام التصميم claymorphism والمكونات المشتركة.
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.13.7
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  camera: ^0.11.0
  flutter_riverpod: ^3.4.2
  flutter_test:
    sdk: flutter
  go_router: ^17.5.0
  qr_flutter: ^4.1.0
  school_core:
    path: ../core

dev_dependencies:
  drift: ^2.35.4
  flutter_lints: ^6.0.0

flutter:
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo.ttf
