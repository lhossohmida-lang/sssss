# إعداد Supabase CLI للنشر فقط (supabase link وdb push وfunctions deploy من GitHub Actions)،
# وليس للتشغيل المحلي. المشروع الحقيقي يُحدَّد بـ`--project-ref` في مسار النشر، فلكل
# مدرسة مشروعها ولا يُحفظ هنا معرّف أي مشروع.
project_id = "school"

[functions.assistant]
verify_jwt = true

[functions.provision-account]
verify_jwt = true

[functions.reset-account-password]
verify_jwt = true

# تستدعيها قاعدة البيانات (pg_net) لا مستخدم بجلسة، وتتحقق بنفسها من سرّ مشترك في الترويسة.
[functions.send-push]
verify_jwt = false
